<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Añadir receta</title>

    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/agregar_recetas.css">
    <link rel="stylesheet" href="style/tipos.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

</head>

<body>

<header class="topbar">

    <div class="logo">
        📖 <span>Nueva receta</span>
    </div>

    <nav class="top-nav">

        <a href="menu.html" class="nav-link">
            <span class="material-symbols-rounded">calendar_month</span>
            Menú
        </a>

        <a href="lista_compra.html" class="nav-link">
            <span class="material-symbols-rounded">shopping_cart</span>
            Compra
        </a>

        <a href="recetas.html" class="nav-link">
            <span class="material-symbols-rounded">menu_book</span>
            Recetas
        </a>

        <a href="agregar_recetas.html" class="nav-link active">
            <span class="material-symbols-rounded">add_circle</span>
            Añadir
        </a>

    </nav>

</header>

<main class="container">

<section class="hero recipeHero">

    <h1>Nueva receta</h1>

    <p>Añádela con su nombre, tipo e ingredientes.</p>

</section>

<form id="recipeForm" class="recipe-form">

    <label for="recipeName">Nombre de la receta</label>

    <input
        id="recipeName"
        required
        placeholder="Ej. Lasaña de carne">

    <label for="recipeType">Tipo de receta</label>

    <select id="recipeType" class="recipe-type-select">
        <option value="ambos" selected>Ambos (comida y cena)</option>
        <option value="comida">Comida</option>
        <option value="cena">Cena</option>
        <option value="extra">Extra (no entra en el menú automático)</option>
    </select>

    <div class="ingredients-header">

        <h2>Ingredientes</h2>

    </div>

    <div id="ingredientList">

    </div>

    <button class="primary submitButton" type="submit">

        <span class="material-symbols-rounded">save</span>

        Guardar receta

    </button>

</form>

</main>

<script src="scripts/script.js"></script>
<script src="scripts/agregar_recetas.js"></script>
</body>
</html>
