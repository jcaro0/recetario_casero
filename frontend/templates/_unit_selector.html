<template id="unitSelectorTemplate">
    <div class="unit-selector">
        <select class="unit-select" aria-label="Unidad">
            <option value="">Sin unidad</option>
            <option value="g">g — gramos</option>
            <option value="kg">kg — kilos</option>
            <option value="ml">ml — mililitros</option>
            <option value="l">l — litros</option>
            <option value="uds">uds — unidades</option>
            <option value="cda">cda — cucharada</option>
            <option value="cdta">cdta — cucharadita</option>
            <option value="taza">taza — tazas</option>
            <option value="__custom__">Personalizada…</option>
        </select>
        <input class="custom-unit" aria-label="Unidad personalizada" placeholder="Ej. paquetes" hidden disabled>
    </div>
</template>
