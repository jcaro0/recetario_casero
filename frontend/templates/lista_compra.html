{% extends "layout.html" %}
{% set title = "Lista Compra" %}
{% set brand = "Cesto de la compra" %}
{% set icon = "🛒" %}
{% set can_share = true %}

{% block content %}
<main class="container">

    <section class="hero shoppingHero">

        <h1>Lista de compra semanal</h1>

        <p>
            Ingredientes del menú de la semana y productos añadidos a mano.
        </p>

    </section>

    <form id="manualForm" class="manual-form" autocomplete="off">
        <fieldset data-write>
            <label>Producto <input name="name" placeholder="Ej. Leche" required></label>
            <label>Cantidad <input name="qty" placeholder="Ej. 2"></label>
            <div class="manual-unit">
                <label for="manualUnit">Unidad</label>
                <div id="manualUnitField"></div>
            </div>
            <button type="submit" class="primary" id="manualSubmit">Añadir producto</button>
            <button type="button" class="secondary hidden" id="manualCancel">Cancelar</button>
        </fieldset>
        <p id="manualStatus" role="status"></p>
    </form>

    <section id="shoppingList" class="shopping-list">

    </section>

</main>
{% endblock %}
