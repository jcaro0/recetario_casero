services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    environment:
      DB_PATH: /app/data/recetario.db
      FRONTEND_FOLDER: /app/frontend
      PORT: "8000"
      BACKUP_DIR: /backups
      BACKUP_RETAIN: "${BACKUP_RETAIN:-14}"
      # Para activar autenticación, sigue README.md y descomenta:
      # AUTH_CONFIG: /config/auth.json
      # Días del menú (por defecto lunes a viernes). Ejemplo con la semana completa:
      # MENU_DAYS: "lunes,martes,miércoles,jueves,viernes,sábado,domingo"

    volumes:
      - ./backend/data:/app/data
      - ${RECETARIO_BACKUP_DIR:?Define RECETARIO_BACKUP_DIR absoluto fuera del repositorio}:/backups
      # - /ruta/externa/config-recetario:/config:ro
      - ./backend/uploads:/app/uploads
      - ./frontend:/app/frontend:ro

    restart: unless-stopped
