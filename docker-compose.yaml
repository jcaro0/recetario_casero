services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    environment:
      DB_PATH: /app/data/recetario.db
      FRONTEND_FOLDER: /app/frontend
      PORT: "8000"
      # Días del menú (por defecto lunes a viernes). Ejemplo con la semana completa:
      # MENU_DAYS: "lunes,martes,miércoles,jueves,viernes,sábado,domingo"

    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./frontend:/app/frontend:ro

    restart: unless-stopped