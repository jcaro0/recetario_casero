services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    environment:
      DB_PATH: /app/data/recetario.db
      FRONTEND_FOLDER: /app/frontend
      PORT: "8000"

    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./frontend:/app/frontend:ro

    restart: unless-stopped